# Variáveis do Laravel em produção (têm prioridade sobre o backend/.env).
x-laravel-env: &laravel-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://localhost}
  FRONTEND_URL: ${APP_URL:-http://localhost}
  EVOLUTION_URL: http://evolution:8080
  EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-figurex-evolution-key}
  EVOLUTION_INSTANCE: figurex

services:
  mysql:
    image: mysql:8.0
    container_name: figurex_mysql_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: figurex
      MYSQL_USER: figurex
      MYSQL_PASSWORD: figurex
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - figurex_mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pfigurex"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: figurex_app_prod
    restart: unless-stopped
    working_dir: /var/www/html
    environment: *laravel-env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: figurex_scheduler_prod
    restart: unless-stopped
    working_dir: /var/www/html
    environment: *laravel-env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    container_name: figurex_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./dist:/var/www/frontend:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mongodb:
    image: mongo:6
    container_name: figurex_mongodb_prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    # Limita o cache do WiredTiger para caber em servidores pequenos.
    command: --wiredTigerCacheSizeGB 0.25
    volumes:
      - figurex_mongodb_prod_data:/data/db

  # Sem porta publicada: a Evolution só é acessada pelo backend, na rede interna.
  evolution:
    image: evoapicloud/evolution-api:v1.8.7
    platform: linux/amd64
    container_name: figurex_evolution_prod
    restart: unless-stopped
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-figurex-evolution-key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_URI: "mongodb://root:root@mongodb:27017/evolution?authSource=admin"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      STORE_MESSAGES: "true"
      STORE_MESSAGE_UP: "true"
      STORE_CONTACTS: "true"
      STORE_CHATS: "true"
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
    volumes:
      - figurex_evolution_prod_instances:/evolution/instances
    depends_on:
      - mongodb

volumes:
  figurex_mysql_prod_data:
  figurex_mongodb_prod_data:
  figurex_evolution_prod_instances:
